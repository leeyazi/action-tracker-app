<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Action Tracker</title>
<style>
  :root {
    --bg: #f5f2fc;
    --card: #ffffff;
    --ink: #2d2640;
    --muted: #6f6688;
    --line: #e4dcf5;
    --border: #c6b5ee;       /* highlighted pastel purple border for cards, inputs, pills */
    --soft: #f1ecfb;
    --accent: #7a5cc0;
    --accent-ink: #ffffff;
    --accent-soft: #ebe3fa;
    --red: #c8423b;
    --red-soft: #fbeceb;
    --done: #aea6c3;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(90,60,160,.06), 0 4px 16px rgba(90,60,160,.07);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 16px 80px; }
  header h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -.01em; }
  header p { margin: 0 0 28px; color: var(--muted); }

  .card {
    background: var(--card); border: 2px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 22px 24px; margin-bottom: 20px;
  }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  .stat { margin: 0; padding: 18px 22px; }
  .stat .num { font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
  .stat .lbl { color: var(--muted); font-size: .95rem; }
  .stat.open .num { color: var(--accent); }
  .stat.overdue .num { color: var(--red); }
  .stat.overdue.zero .num { color: var(--muted); }

  /* Form */
  form h2, .group h2 { font-size: 1.15rem; margin: 0 0 14px; }
  .fields { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 12px; align-items: end; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
  input[type=text], input[type=date] {
    width: 100%; font: inherit; color: var(--ink); background: var(--soft);
    border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 14px;
  }
  input:focus { outline: none; border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px var(--accent-soft); }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 10px;
  }
  .btn-primary {
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
    padding: 11px 22px; white-space: nowrap;
  }
  .btn-primary:hover { filter: brightness(.95); }
  .error { color: var(--red); font-size: .9rem; margin-top: 10px; min-height: 1em; }

  /* Toolbar */
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 28px 0 14px; gap: 12px; flex-wrap: wrap; }
  .toolbar h2 { margin: 0; font-size: 1.3rem; }
  .toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .95rem; cursor: pointer; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

  /* Groups */
  .group-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: var(--accent-soft); color: var(--accent); border: 2px solid var(--border);
    display: grid; place-items: center; font-weight: 700;
  }
  .group-head h2 { margin: 0; flex: 1; }
  .pill { font-size: .85rem; color: var(--muted); background: var(--soft); padding: 2px 10px; border-radius: 999px; border: 1.5px solid var(--border); }

  ul { list-style: none; margin: 0; padding: 0; }
  li.item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 12px; margin: 0 -12px; border-radius: 10px;
    border-top: 1px solid var(--line);
  }
  li.item:first-child { border-top: 0; }
  li.item.overdue { background: var(--red-soft); border-top-color: transparent; }
  li.item.overdue + li.item { border-top-color: transparent; }
  .check {
    appearance: none; width: 26px; height: 26px; flex: none; margin: 0;
    border: 2px solid var(--done); border-radius: 8px; cursor: pointer;
    display: grid; place-items: center; background: var(--card);
  }
  .check:checked { background: var(--accent); border-color: var(--accent); }
  .check:checked::after { content: ""; width: 7px; height: 13px; border: solid #fff; border-width: 0 3px 3px 0; transform: translateY(-2px) rotate(45deg); }
  .check:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
  .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .due { font-size: .9rem; color: var(--muted); white-space: nowrap; }
  li.overdue .text, li.overdue .due { color: var(--red); }
  li.overdue .due { font-weight: 600; }
  li.today .due { color: var(--accent); font-weight: 600; }
  li.done .text { text-decoration: line-through; color: var(--done); }
  li.done .due { color: var(--done); }
  .del {
    background: none; color: var(--muted); width: 34px; height: 34px; font-size: 1.3rem; line-height: 1;
    opacity: 0; transition: opacity .15s;
  }
  li.item:hover .del, .del:focus { opacity: 1; }
  .del:hover { color: var(--red); background: var(--soft); }
  @media (hover: none) { .del { opacity: 1; } }

  .empty { text-align: center; color: var(--muted); padding: 40px 24px; }
  .status { background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 10px 14px; margin-bottom: 20px; font-size: .95rem; }
  .status:empty { display: none; }
  .btn-primary:disabled { opacity: .6; cursor: default; }
  [hidden] { display: none !important; }

  /* Signed-in bar */
  .userbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: -12px 0 24px; color: var(--muted); font-size: .95rem; }
  .userbar strong { color: var(--ink); }
  .userbar .spacer { flex: 1; }
  .btn-link { background: var(--card); color: var(--ink); padding: 6px 12px; font-size: .9rem; border: 1.5px solid var(--border); }
  .btn-link:hover { background: var(--soft); border-color: var(--accent); }
  .btn-link[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); }

  /* Sign-in and password forms */
  .narrow { max-width: 420px; margin: 0 auto; }
  .narrow .row { margin-bottom: 14px; }
  .narrow .btn-primary { width: 100%; }
  .narrow p { color: var(--muted); margin: -6px 0 16px; font-size: .95rem; }
  input[type=password] {
    width: 100%; font: inherit; color: var(--ink); background: var(--soft);
    border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 14px;
  }
  .actions-row { display: flex; gap: 10px; }
  .actions-row .btn-link { padding: 11px 18px; font-size: 1rem; }

  /* Users panel */
  .user-fields { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; margin-bottom: 18px; }
  .user-list li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .user-list li:first-child { border-top: 0; }
  .user-list .avatar { width: 32px; height: 32px; font-size: .9rem; }
  .user-list .name { flex: 1; }
  .ok { color: #2f7d4f; font-size: .9rem; margin-top: 10px; }
  @media (max-width: 640px) { .user-fields { grid-template-columns: 1fr; } }

  @media (max-width: 640px) {
    body { font-size: 17px; }
    .wrap { padding-top: 24px; }
    .fields { grid-template-columns: 1fr 1fr; }
    .fields .f-title, .fields .f-btn { grid-column: 1 / -1; }
    .btn-primary { width: 100%; }
    .stats { gap: 10px; }
    .stat { padding: 14px; }
    .stat .num { font-size: 1.7rem; }
    .card { padding: 18px; }
    li.item { flex-wrap: wrap; }
    .due { margin-left: 40px; order: 3; width: 100%; margin-top: -6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Meeting Actions</h1>
    <p>What we agreed, who owns it, and when it's due.</p>
  </header>

  <div class="userbar" id="userbar" hidden>
    <span>Signed in as <strong id="whoami"></strong></span>
    <span class="spacer"></span>
    <button type="button" class="btn-link" id="usersBtn" aria-pressed="false">Users</button>
    <button type="button" class="btn-link" id="pwBtn">Change password</button>
    <button type="button" class="btn-link" id="signOutBtn">Sign out</button>
  </div>

  <div class="status" id="status" role="status"></div>

  <form class="card narrow" id="loginForm" hidden>
    <h2>Sign in</h2>
    <div class="row">
      <label for="loginUser">Username</label>
      <input type="text" id="loginUser" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30">
    </div>
    <div class="row">
      <label for="loginPw">Password</label>
      <input type="password" id="loginPw" autocomplete="current-password">
    </div>
    <button type="submit" class="btn-primary">Sign in</button>
    <div class="error" id="loginError" role="alert"></div>
  </form>

  <form class="card narrow" id="pwForm" hidden>
    <h2>Set a new password</h2>
    <p id="pwIntro"></p>
    <div class="row">
      <label for="newPw">New password</label>
      <input type="password" id="newPw" autocomplete="new-password">
    </div>
    <div class="row">
      <label for="newPw2">Repeat new password</label>
      <input type="password" id="newPw2" autocomplete="new-password">
    </div>
    <div class="actions-row">
      <button type="submit" class="btn-primary">Save password</button>
      <button type="button" class="btn-link" id="pwCancel">Cancel</button>
    </div>
    <div class="error" id="pwError" role="alert"></div>
  </form>

  <main id="appView" hidden>
  <section class="card" id="usersPanel" hidden>
    <h2>Users</h2>
    <form id="addUserForm" autocomplete="off">
      <div class="user-fields">
        <div>
          <label for="newUser">Username</label>
          <input type="text" id="newUser" placeholder="e.g. sam" autocapitalize="none" spellcheck="false" maxlength="30">
        </div>
        <div>
          <label for="newUserPw">Initial password</label>
          <input type="text" id="newUserPw" value="password" autocomplete="off">
        </div>
        <div><button type="submit" class="btn-primary">Add user</button></div>
      </div>
      <div class="error" id="userError" role="alert"></div>
      <div class="ok" id="userOk" role="status"></div>
    </form>
    <ul class="user-list" id="userList"></ul>
  </section>

  <section class="stats" aria-label="Summary">
    <div class="card stat open"><div class="num" id="openCount">0</div><div class="lbl">Open</div></div>
    <div class="card stat"><div class="num" id="doneCount">0</div><div class="lbl">Done</div></div>
    <div class="card stat overdue" id="overdueCard"><div class="num" id="overdueCount">0</div><div class="lbl">Overdue</div></div>
  </section>

  <form class="card" id="addForm" autocomplete="off">
    <h2>Add an action</h2>
    <div class="fields">
      <div class="f-title">
        <label for="title">Action</label>
        <input type="text" id="title" placeholder="e.g. Send revised budget to finance" maxlength="200">
      </div>
      <div>
        <label for="owner">Owner</label>
        <input type="text" id="owner" placeholder="Name" list="ownerList" maxlength="60">
        <datalist id="ownerList"></datalist>
      </div>
      <div>
        <label for="due">Due date</label>
        <input type="date" id="due">
      </div>
      <div class="f-btn"><button type="submit" class="btn-primary">Add</button></div>
    </div>
    <div class="error" id="error" role="alert"></div>
  </form>

  <div class="toolbar">
    <h2>By owner</h2>
    <label class="toggle"><input type="checkbox" id="showDone" checked> Show done</label>
  </div>

  <div id="groups"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  // The publishable key is safe to ship in the page; sign-in plus row level security decide access.
  var SUPABASE_URL = 'https://xbjjmfdmdcdsyplhgqus.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_n0AeHwTE71p56PrjUav_iQ_KRpyrY7D';
  var EMAIL_DOMAIN = 'action-tracker.local'; // usernames sign in as <username>@action-tracker.local
  var TABLE = 'actions';
  var PREF = 'meetingActionTracker.showDone';
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var actions = [];
  var users = [];
  var loaded = false;
  var me = null;       // { id, username, must_change_password } once signed in
  var channel = null;
  var $ = function (id) { return document.getElementById(id); };

  function fromRow(r) {
    return { id: r.id, title: r.title, owner: r.owner, due: r.due, done: r.done,
             doneAt: r.done_at, created: Date.parse(r.created_at) };
  }
  function setStatus(msg) { $('status').textContent = msg || ''; }
  function fail(what, err) {
    console.error(what, err);
    setStatus('Could not ' + what + '. Check your connection and try again.');
  }
  // Insert or replace by id, so our own writes and their realtime echoes don't duplicate
  function upsertLocal(a) {
    var i = actions.findIndex(function (x) { return x.id === a.id; });
    if (i === -1) actions.push(a); else actions[i] = a;
  }

  function load() {
    return db.from(TABLE).select('*').then(function (res) {
      if (res.error) return fail('load actions', res.error);
      actions = res.data.map(fromRow);
      loaded = true;
      setStatus('');
      render();
    });
  }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmtDate(s) {
    var p = s.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
  }
  function dueLabel(a, today) {
    if (a.done) return 'Done';
    if (a.due < today) {
      var days = Math.round((new Date(today) - new Date(a.due)) / 864e5);
      return 'Overdue ' + days + 'd · ' + fmtDate(a.due);
    }
    if (a.due === today) return 'Due today';
    return 'Due ' + fmtDate(a.due);
  }
  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function normOwner(name) {
    // Match an existing owner case-insensitively so "sam" and "Sam" share a group
    var lower = name.toLowerCase();
    for (var i = 0; i < actions.length; i++) if (actions[i].owner.toLowerCase() === lower) return actions[i].owner;
    return name;
  }

  function render() {
    var today = todayStr();
    var showDone = $('showDone').checked;
    var open = 0, done = 0, overdue = 0;
    actions.forEach(function (a) {
      if (a.done) done++; else { open++; if (a.due < today) overdue++; }
    });
    $('openCount').textContent = open;
    $('doneCount').textContent = done;
    $('overdueCount').textContent = overdue;
    $('overdueCard').classList.toggle('zero', overdue === 0);

    // Owner suggestions
    var owners = Array.from(new Set(actions.map(function (a) { return a.owner; }).concat(users.map(function (u) { return u.username; })))).sort(function (a, b) { return a.localeCompare(b); });
    $('ownerList').innerHTML = owners.map(function (o) { return '<option value="' + esc(o) + '">'; }).join('');

    // Group
    var groups = {};
    actions.forEach(function (a) {
      if (!showDone && a.done) return;
      (groups[a.owner] = groups[a.owner] || []).push(a);
    });
    var names = Object.keys(groups);
    // Owners with overdue first, then most open, then alphabetical
    var stat = function (n) {
      var list = groups[n];
      return { od: list.filter(function (a) { return !a.done && a.due < today; }).length,
               op: list.filter(function (a) { return !a.done; }).length };
    };
    names.sort(function (x, y) {
      var a = stat(x), b = stat(y);
      return (b.od - a.od) || (b.op - a.op) || x.localeCompare(y);
    });

    if (!names.length) {
      $('groups').innerHTML = '<div class="card empty">' +
        (!loaded ? 'Loading actions…' : actions.length ? 'Everything is done. Nice work.' : 'No actions yet. Add the first one from your last meeting above.') +
        '</div>';
      return;
    }

    $('groups').innerHTML = names.map(function (name) {
      var list = groups[name].slice().sort(function (a, b) {
        return (a.done - b.done) || a.due.localeCompare(b.due) || a.created - b.created;
      });
      var s = stat(name);
      var pill = s.op + ' open' + (s.od ? ' · ' + s.od + ' overdue' : '');
      return '<section class="card group">' +
        '<div class="group-head"><div class="avatar" aria-hidden="true">' + esc(name.charAt(0).toUpperCase()) + '</div>' +
        '<h2>' + esc(name) + '</h2><span class="pill">' + pill + '</span></div>' +
        '<ul>' + list.map(function (a) {
          var cls = ['item'];
          if (a.done) cls.push('done');
          else if (a.due < today) cls.push('overdue');
          else if (a.due === today) cls.push('today');
          return '<li class="' + cls.join(' ') + '">' +
            '<input type="checkbox" class="check" data-id="' + a.id + '"' + (a.done ? ' checked' : '') +
            ' aria-label="Mark done: ' + esc(a.title) + '">' +
            '<span class="text">' + esc(a.title) + '</span>' +
            '<span class="due">' + dueLabel(a, today) + '</span>' +
            '<button class="del" data-del="' + a.id + '" title="Delete" aria-label="Delete: ' + esc(a.title) + '">&times;</button>' +
            '</li>';
        }).join('') + '</ul></section>';
    }).join('');
  }

  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var title = $('title').value.trim();
    var owner = $('owner').value.trim().replace(/\s+/g, ' ');
    var due = $('due').value;
    var missing = [];
    if (!title) missing.push('an action');
    if (!owner) missing.push('an owner');
    if (!due) missing.push('a due date');
    if (missing.length) {
      $('error').textContent = 'Please add ' + missing.join(', ').replace(/, ([^,]*)$/, ' and $1') + '.';
      return;
    }
    $('error').textContent = '';
    var btn = this.querySelector('button[type=submit]');
    btn.disabled = true;
    db.from(TABLE).insert({ title: title, owner: normOwner(owner), due: due }).select().single().then(function (res) {
      btn.disabled = false;
      if (res.error) return fail('add the action', res.error);
      setStatus('');
      upsertLocal(fromRow(res.data));
      render();
      $('title').value = '';
      $('title').focus(); // keep owner + date for fast entry of several actions
    });
  });

  $('groups').addEventListener('change', function (e) {
    var id = e.target.getAttribute('data-id');
    if (!id) return;
    var a = actions.find(function (x) { return x.id === id; });
    if (!a) return;
    var prev = { done: a.done, doneAt: a.doneAt };
    a.done = e.target.checked;
    a.doneAt = a.done ? new Date().toISOString() : null;
    render();
    db.from(TABLE).update({ done: a.done, done_at: a.doneAt }).eq('id', id).then(function (res) {
      if (!res.error) return setStatus('');
      a.done = prev.done; a.doneAt = prev.doneAt; render();
      fail('update the action', res.error);
    });
  });

  $('groups').addEventListener('click', function (e) {
    var id = e.target.getAttribute('data-del');
    if (!id) return;
    actions = actions.filter(function (x) { return x.id !== id; });
    render();
    db.from(TABLE).delete().eq('id', id).then(function (res) {
      if (!res.error) return setStatus('');
      fail('delete the action', res.error);
      load();
    });
  });

  // Live updates from other people's browsers (only while signed in, since RLS hides rows otherwise)
  function subscribe() {
    if (channel) return;
    channel = db.channel('actions-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, function (p) {
        if (p.eventType === 'DELETE') {
          actions = actions.filter(function (x) { return x.id !== p.old.id; });
        } else {
          upsertLocal(fromRow(p.new));
        }
        render();
      })
      .subscribe();
  }
  function unsubscribe() {
    if (channel) { db.removeChannel(channel); channel = null; }
  }

  /* ---------- Sign-in, password and screens ---------- */

  function show(view) {
    $('loginForm').hidden = view !== 'login';
    $('pwForm').hidden = view !== 'password';
    $('appView').hidden = view !== 'app';
    $('userbar').hidden = !me || view === 'login';
    $('pwBtn').hidden = $('usersBtn').hidden = !me || me.must_change_password;
  }

  function showPasswordForm(forced) {
    $('pwIntro').textContent = forced
      ? 'Welcome, ' + me.username + '. You signed in with an initial password, so please choose your own before continuing.'
      : 'Choose a new password for ' + me.username + '.';
    $('pwCancel').hidden = forced;
    $('pwError').textContent = '';
    $('newPw').value = $('newPw2').value = '';
    show('password');
    $('newPw').focus();
  }

  function onSession(session) {
    setStatus('');
    if (!session) {
      me = null; actions = []; users = []; loaded = false;
      unsubscribe();
      $('whoami').textContent = '';
      $('loginPw').value = '';
      show('login');
      return;
    }
    db.from('profiles').select('id, username, must_change_password').eq('id', session.user.id).maybeSingle().then(function (res) {
      if (res.error) return fail('load your profile', res.error);
      if (!res.data) {
        // Signed in to Supabase but never added to this app (e.g. a stray sign-up)
        db.auth.signOut();
        $('loginError').textContent = "This account doesn't have access to the tracker.";
        return;
      }
      me = res.data;
      $('whoami').textContent = me.username;
      if (me.must_change_password) return showPasswordForm(true);
      show('app');
      subscribe();
      load();
      loadUsers();
    });
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var username = $('loginUser').value.trim().toLowerCase();
    var password = $('loginPw').value;
    if (!username || !password) { $('loginError').textContent = 'Please enter your username and password.'; return; }
    $('loginError').textContent = '';
    var btn = this.querySelector('button[type=submit]');
    btn.disabled = true;
    db.auth.signInWithPassword({ email: username + '@' + EMAIL_DOMAIN, password: password }).then(function (res) {
      btn.disabled = false;
      if (res.error) {
        $('loginError').textContent = /invalid/i.test(res.error.message) ? 'Wrong username or password.' : res.error.message;
        $('loginPw').select();
      }
      // On success onAuthStateChange takes over
    });
  });

  $('pwForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('newPw').value;
    if (pw.length < 8) { $('pwError').textContent = 'Use at least 8 characters.'; return; }
    if (pw.toLowerCase() === 'password') { $('pwError').textContent = 'Please choose something other than "password".'; return; }
    if (pw !== $('newPw2').value) { $('pwError').textContent = "The two passwords don't match."; return; }
    $('pwError').textContent = '';
    var btn = this.querySelector('button[type=submit]');
    btn.disabled = true;
    db.auth.updateUser({ password: pw }).then(function (res) {
      if (res.error) { btn.disabled = false; $('pwError').textContent = res.error.message; return; }
      return db.rpc('mark_password_changed').then(function (r) {
        btn.disabled = false;
        if (r.error || r.data === false) { $('pwError').textContent = 'Password saved, but something went wrong. Please sign in again.'; return; }
        var wasForced = me.must_change_password;
        me.must_change_password = false;
        if (wasForced) { show('app'); subscribe(); load(); loadUsers(); }
        else show('app');
        setStatus('');
      });
    });
  });

  $('pwCancel').addEventListener('click', function () { show('app'); });
  $('pwBtn').addEventListener('click', function () { showPasswordForm(false); });
  $('signOutBtn').addEventListener('click', function () { db.auth.signOut(); });

  /* ---------- Users ---------- */

  function loadUsers() {
    return db.from('profiles').select('username, must_change_password, created_at').order('username').then(function (res) {
      if (res.error) return fail('load users', res.error);
      users = res.data;
      $('userList').innerHTML = users.map(function (u) {
        return '<li><div class="avatar" aria-hidden="true">' + esc(u.username.charAt(0).toUpperCase()) + '</div>' +
          '<span class="name">' + esc(u.username) + (me && u.username === me.username ? ' (you)' : '') + '</span>' +
          '<span class="pill">' + (u.must_change_password ? 'Not signed in yet' : 'Active') + '</span></li>';
      }).join('');
      render();
    });
  }

  $('usersBtn').addEventListener('click', function () {
    var open = $('usersPanel').hidden;
    $('usersPanel').hidden = !open;
    this.setAttribute('aria-pressed', open);
    if (open) { loadUsers(); $('newUser').focus(); }
  });

  $('addUserForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var username = $('newUser').value.trim().toLowerCase();
    var password = $('newUserPw').value;
    $('userOk').textContent = '';
    if (!/^[a-z0-9._-]{2,30}$/.test(username)) {
      $('userError').textContent = 'Username must be 2–30 characters: letters, numbers, dot, dash or underscore.'; return;
    }
    if (password.length < 6) { $('userError').textContent = 'Initial password must be at least 6 characters.'; return; }
    $('userError').textContent = '';
    var btn = this.querySelector('button[type=submit]');
    btn.disabled = true;
    db.functions.invoke('admin-create-user', { body: { username: username, password: password } }).then(function (res) {
      btn.disabled = false;
      if (!res.error) {
        $('userOk').textContent = 'Added ' + username + '. They can sign in with the initial password and will be asked to change it.';
        $('newUser').value = '';
        return loadUsers();
      }
      // The function returns { error: message } with a non-2xx status
      var ctx = res.error.context;
      return (ctx && ctx.json ? ctx.json().catch(function () { return {}; }) : Promise.resolve({})).then(function (body) {
        $('userError').textContent = body.error || 'Could not add the user. Please try again.';
      });
    });
  });

  try { $('showDone').checked = localStorage.getItem(PREF) !== '0'; } catch (e) {}
  $('showDone').addEventListener('change', function () {
    try { localStorage.setItem(PREF, this.checked ? '1' : '0'); } catch (e) {}
    render();
  });

  $('due').value = (function () { var d = new Date(); d.setDate(d.getDate() + 7);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();

  // Refetch when the tab regains focus: re-checks overdue status and catches changes missed while asleep
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && me && !me.must_change_password) load();
  });

  render();
  // Fires once with the stored session on load, then on every sign-in/out.
  // Deferred because calling Supabase inside this callback can deadlock the auth lock.
  db.auth.onAuthStateChange(function (event, session) {
    if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') return;
    // supabase-js re-emits SIGNED_IN when the tab regains focus; don't reset the screen for the same user
    if (event === 'SIGNED_IN' && me && session && me.id === session.user.id) return;
    setTimeout(function () { onSession(session); }, 0);
  });
})();
</script>
</body>
</html>
